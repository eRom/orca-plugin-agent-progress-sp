<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2b33"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="260" y1="196" x2="350" y2="270">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#f0782a"/>
    </linearGradient>
    <linearGradient id="accBar" gradientUnits="userSpaceOnUse" x1="104" y1="0" x2="250" y2="0">
      <stop offset="0" stop-color="#ffb84d"/>
      <stop offset="1" stop-color="#f0782a"/>
    </linearGradient>
    <linearGradient id="card" gradientUnits="userSpaceOnUse" x1="0" y1="128" x2="0" y2="360">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
  </defs>
  <!-- fond -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <!-- carte : une frise d'étapes, la troisième est en cours -->
  <rect x="56" y="128" width="400" height="232" rx="44" fill="url(#card)"/>
  <!-- rail : parcouru en sombre, à venir en gris clair -->
  <rect x="116" y="198" width="190" height="12" rx="6" fill="#1b1c21"/>
  <rect x="300" y="198" width="96" height="12" rx="6" fill="#cfd0d8"/>
  <!-- étapes passées : pastille sombre et coche -->
  <circle cx="116" cy="204" r="26" fill="#1b1c21"/>
  <path d="M104 204 L113 213 L129 194" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="210" cy="204" r="26" fill="#1b1c21"/>
  <path d="M198 204 L207 213 L223 194" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- étape en cours : l'accent ambre, avec un halo -->
  <circle cx="306" cy="204" r="48" fill="#fde1b8"/>
  <circle cx="306" cy="204" r="34" fill="url(#acc)"/>
  <circle cx="306" cy="204" r="11" fill="#1b1c21"/>
  <!-- étape à venir : cercle vide -->
  <circle cx="396" cy="204" r="22" fill="#ffffff" stroke="#cfd0d8" stroke-width="9"/>
  <!-- barre de tâches : piste claire, remplissage ambre -->
  <rect x="104" y="296" width="304" height="20" rx="10" fill="#d4d5dc"/>
  <rect x="104" y="296" width="146" height="20" rx="10" fill="url(#accBar)"/>
</svg>
